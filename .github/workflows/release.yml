name: Release

# Builds @ckq/shared once, from the tag, and attaches the packed file to the tag's GitHub Release.
# Consumers install that file, never the git tag: a git install makes Yarn 1 run a nested install of
# this repo's dev tools to build dist/ inside the consumer's install, which races it in Yarn's cache
# (ADR frontend-006 amendment, chesskq-workspace docs/plans/shared-prebuilt-release-tarball-plan.md).
# A published file is never replaced: consumers' lockfiles pin its hash. A fix is a new version.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to publish, e.g. v0.28.0 (tags pushed before this workflow existed)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Pack
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then echo "::error::tag $TAG does not match package.json version $VERSION"; exit 1; fi
          FILE=$(npm pack --silent | tail -n 1)   # npm pack runs prepare (tsup) first
          if [ "$FILE" != "ckq-shared-$VERSION.tgz" ]; then echo "::error::unexpected pack file '$FILE'"; exit 1; fi
          for f in package/package.json package/dist/index.js package/dist/index.mjs package/dist/index.d.ts package/dist/auth.js package/dist/auth.mjs package/dist/auth.d.ts; do
            tar -tzf "$FILE" | grep -qx "$f" || { echo "::error::$FILE has no $f"; exit 1; }
          done
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          {
            echo "### $FILE"
            echo '```'
            sha256sum "$FILE"
            echo '```'
            echo "Pin: \`\"@ckq/shared\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE\"\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish (never replaces an existing file)
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$FILE"; then
              echo "::error::$TAG already has $FILE; a published file is never replaced"; exit 1
            fi
            gh release upload "$TAG" "$FILE"
          else
            gh release create "$TAG" "$FILE" --title "$TAG" --notes "Install: \"@ckq/shared\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE\""
          fi
