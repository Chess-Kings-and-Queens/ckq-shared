name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Shared installer, pinned to a chesskq-workspace commit (docs/repos.md § Secret scanning).
        uses: Chess-Kings-and-Queens/chesskq-workspace/.github/actions/install-gitleaks@01b9855ac454eadfabebe9f61df4e1034a8076d8
      - name: Scan the commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD_SHA~1..$HEAD_SHA"
          else
            RANGE="$PUSH_BEFORE..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="$RANGE" --redact --verbose --no-banner --exit-code 1 .
